name: PR

# Two things every pull request has to clear: the tests still pass, and the PR
# says how the version should move. The second is what makes "merge the PR" the
# whole release procedure - see .github/workflows/release.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-label:
    name: release label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exactly one of major / minor / patch
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/release/select_bump.py

  test:
    name: engine and updater tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # test_engine.py synthesises its fixtures with ffmpeg, and the engine
      # probes them with ffprobe. Neither is on the runner image.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Version files agree
        run: python scripts/release/bump_version.py --check

      - name: Engine unit tests
        run: python tests/test_engine.py

      - name: Updater unit tests
        run: node tests/test_updater.js

      - name: Preset validation
        run: python scripts/validate_presets.py

      - name: Calibration audit
        run: python scripts/audit_calibration.py

  smoke:
    # Boots the real main process and renderer, checks the engine answers and
    # that the renderer came up clean. macOS rather than Linux because that is
    # where the app ships and where Electron needs no display server wrangling.
    name: electron smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install the app's dev dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Smoke test
        working-directory: app
        env:
          AESTHETICIAN_PYTHON: python
        run: npx electron . --smoke

# tests/test_smoke.py is deliberately not here: it renders videos-samples/, which
# is gitignored media that a runner does not have. Run it locally before pushing.
