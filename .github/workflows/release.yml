name: Release

# Merging a labelled pull request into main cuts the release. The label says how
# the version moves; this bumps it everywhere, builds the desktop binaries on a
# real runner per target, and publishes them with notes taken from the pull
# request itself - description, screenshots and all.
#
# The tag is created by the publish step, not up front, so a failed build leaves
# no half-release behind. Setup this needs once is in docs/releases.md.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: How to move the version
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Never two releases at once: they would race to push the version bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump the version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
      previous: ${{ steps.previous.outputs.tag }}
      skip: ${{ steps.kind.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Which way does the version move
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH: ${{ inputs.bump }}
        run: |
          if [ -n "$DISPATCH" ]; then
            kind="$DISPATCH"
          else
            kind="$(python3 scripts/release/select_bump.py)"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = "none" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no-release label set - merged without cutting a release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Previous tag
        id: previous
        if: steps.kind.outputs.skip != 'true'
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Bump the version everywhere
        id: bump
        if: steps.kind.outputs.skip != 'true'
        run: python3 scripts/release/bump_version.py "${{ steps.kind.outputs.kind }}"

      - name: Commit and push
        id: push
        if: steps.kind.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml aesthetician/__init__.py app/package.json app/package-lock.json
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    # All three targets have built and run, so a failure is a regression and
    # stops publication. A release never advertises only part of the platform
    # set promised by the download page.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
          - target: mac-x64
            runner: macos-15-intel
          - target: win-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Building the relocatable interpreter and fetching ffmpeg is the slow
      # half of a build, and neither changes between releases.
      - name: Cache the bundled runtime and ffmpeg
        uses: actions/cache@v6
        with:
          path: .cache/package
          key: pkg-${{ matrix.target }}-${{ hashFiles('scripts/package/targets.py', 'pyproject.toml') }}
          restore-keys: pkg-${{ matrix.target }}-

      - name: Fetch the asset packs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release/asset_bundle.py fetch --repo "${{ github.repository }}"

      - name: Install the app's dev dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # The Windows runner's console is cp1252 and these scripts print box
          # drawing; scripts/package/common.py handles it, this is the braces.
          PYTHONUTF8: '1'
        run: python scripts/package/build.py --target ${{ matrix.target }}

      - name: Smoke test the packaged app
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "win-x64" ]; then
            exe=$(find app/dist -name 'Aesthetician.exe' -path '*win-unpacked*' | head -1)
          else
            exe=$(find app/dist -path '*/Aesthetician.app/Contents/MacOS/Aesthetician' -type f | head -1)
          fi
          if [ -z "$exe" ]; then echo "::error::no packaged Aesthetician executable to test"; exit 1; fi
          "$exe" --smoke

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p out-dist
          # What a human downloads plus what the in-app updater downloads.
          # Blockmaps and the unpacked app stay behind.
          find app/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*setup.exe' \) \
            -exec cp {} out-dist/ \;
          ls -lh out-dist

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: out-dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish release
    needs: [prepare, build]
    # A release is published only when the version bump and every native build
    # succeeded. `always()` lets this condition be evaluated after a failure.
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: incoming
          pattern: build-*

      - name: Gather and checksum
        run: |
          mkdir -p release
          find incoming -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*setup.exe' \) \
            -exec mv {} release/ \;
          if [ -z "$(ls -A release 2>/dev/null)" ]; then
            echo "::error::every build target failed - nothing to release"
            exit 1
          fi
          # Stable names make /releases/latest/download/... permanent direct
          # links for the splash page while the versioned originals remain for
          # release history and the in-app updater.
          mac_arm="release/Aesthetician-${{ needs.prepare.outputs.version }}-mac-arm64.dmg"
          mac_intel="release/Aesthetician-${{ needs.prepare.outputs.version }}-mac-x64.dmg"
          windows="release/Aesthetician-${{ needs.prepare.outputs.version }}-win-x64-setup.exe"
          test -f "$mac_arm"
          test -f "$mac_intel"
          test -f "$windows"
          cp "$mac_arm" release/Aesthetician-mac-arm64.dmg
          cp "$mac_intel" release/Aesthetician-mac-x64.dmg
          cp "$windows" release/Aesthetician-win-x64-setup.exe
          cd release
          # The in-app updater verifies its download against this file.
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # workflow_dispatch has no PR behind it; the notes then carry just the
          # download table, which beats failing the release over prose.
          if [ -n "$PR" ]; then
            gh api "repos/${{ github.repository }}/pulls/$PR" > pr.json
            gh api "repos/${{ github.repository }}/issues/$PR/comments?per_page=100" > issue-comments.json
            gh api "repos/${{ github.repository }}/pulls/$PR/comments?per_page=100" > review-comments.json
            jq -s add issue-comments.json review-comments.json > comments.json
          fi
          python3 scripts/release/release_notes.py \
            ${PR:+--pr pr.json --comments comments.json} \
            --version "${{ needs.prepare.outputs.version }}" \
            --previous "${{ needs.prepare.outputs.previous }}" \
            --repo "${{ github.repository }}" \
            --files release \
            -o notes.md
          echo "--- notes ---"; cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target creates the tag here, at the bumped commit: a build that
          # fell over earlier leaves no tag pointing at a release that is not
          # coming. --latest is what makes /releases/latest - and so the in-app
          # updater - see this one.
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.sha }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file notes.md \
            --latest \
            release/*

      - name: Move the rolling `latest` tag
        run: |
          # A stable ref to check out or link to. GitHub's own "Latest" badge
          # comes from --latest above, not from this.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ needs.prepare.outputs.sha }}"
          git push -f origin latest

      - name: Summary
        run: |
          {
            echo "## ${{ needs.prepare.outputs.tag }} published"
            echo
            echo "| file | size |"
            echo "|---|---|"
            for f in release/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
