name: Pages

# Publishes the download splash page after it lands on main. The page itself is
# static. The workflow copies the already-tracked app preview and icon into the
# deployment artifact, so no generated media needs to live under site/.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'preview.jpg'
      - 'app/renderer/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: assemble site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble static files
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp preview.jpg _site/img/preview.jpg
          cp app/renderer/icon.png _site/img/icon.png

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
