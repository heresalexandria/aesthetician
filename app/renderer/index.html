<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:;" />
  <title>Aesthetician</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="titlebar">
    <span class="brand"><img src="icon.png" alt="" draggable="false"/><span class="brand-name">AESTHETICIAN</span></span>
    <span id="file-chip" class="hidden"></span>
  </div>
  <div id="tab-bar" class="hidden"></div>

  <div id="drop-screen">
    <div class="drop-inner" id="drop-zone">
      <img class="drop-icon" src="icon.png" width="104" height="104" alt="" draggable="false"/>
      <h1>Drop a clip</h1>
      <p>Drag a video or audio file here to start applying archival aesthetics<br/><span class="dim">MP4 · MOV · WAV · MP3 · anything ffmpeg reads</span></p>
      <button id="btn-browse">Browse files<span class="kbd">⌘O</span></button>
      <button id="btn-drop-cancel" class="link-btn hidden">← back to what I was working on</button>
      <div id="env-warning" class="hidden"></div>
    </div>
  </div>

  <div id="workspace" class="hidden">
    <aside id="preset-pane">
      <div class="pane-head">
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="preset-search" type="text" placeholder="Search 191 aesthetics…" spellcheck="false"/>
          </div>
          <select id="era-filter" title="Filter by decade"><option value="">Any era</option></select>
        </div>
        <div id="family-chips"></div>
      </div>
      <div id="preset-list"></div>
    </aside>

    <main id="center-pane">
      <div id="player-wrap">
        <video id="video-b" loop muted playsinline></video>
        <video id="video-a" loop muted playsinline></video>
        <div id="player-empty">Pick an aesthetic to render a preview</div>
        <div id="render-overlay" class="hidden">
          <div class="spinner"></div>
          <div id="render-phase">rendering…</div>
          <div class="mini-bar"><div id="render-bar"></div></div>
        </div>
        <div id="ab-badge" class="hidden">ORIGINAL</div>
      </div>
      <div id="player-controls">
        <button id="btn-ab" title="Hold to see the untreated original (or hold B)">A/B</button>
        <button id="btn-mute" class="icon-btn" title="Toggle audio">
          <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
          <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg>
        </button>
        <div id="scrub-wrap">
          <span class="dim" id="scrub-label">preview at 0.0s</span>
          <input id="scrub" class="range-fill" type="range" min="0" max="10" step="0.1" value="0"/>
        </div>
        <div class="pc-group" title="Length of the rendered preview window">
          <select id="preview-len">
            <option value="2">2s</option>
            <option value="3" selected>3s</option>
            <option value="5">5s</option>
            <option value="8">8s</option>
          </select>
        </div>
        <div class="pc-group" title="Preview render resolution - lower is faster, exports are always full quality">
          <select id="preview-scale">
            <option value="0.25">25%</option>
            <option value="0.5" selected>50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
          </select>
        </div>
        <label class="switch" title="Re-render the preview automatically after every change">
          <input type="checkbox" id="auto-preview" checked/><span class="knob"></span><span class="sw-label">auto</span>
        </label>
        <button id="btn-render" class="accent">Preview</button>
      </div>
      <div id="export-bar">
        <div id="export-status" class="dim">Ready.</div>
        <div class="grow"></div>
        <div id="cache-row" class="dim">
          <span class="cache-label">Preview cache</span>
          <span id="cache-size">-</span>
          <button id="btn-cache-clear" class="link-btn" title="Delete every cached preview render. They are only rebuilt when you need them again.">Clear</button>
          <button id="btn-cache-reveal" class="link-btn" title="Open the cache folder">Reveal</button>
        </div>
        <label class="check dim"><input type="checkbox" id="exp-video-only"/> video only</label>
        <label class="check dim"><input type="checkbox" id="exp-audio-only"/> audio only</label>
        <button id="btn-export-cancel" class="danger hidden" title="Stop the export and delete the partial file">Cancel</button>
        <button id="btn-export" class="accent big">Export Full Video</button>
      </div>
    </main>

    <aside id="param-pane">
      <div class="pane-head row">
        <div id="preset-title-wrap">
          <div id="preset-title">-</div>
          <div id="preset-sub" class="dim"></div>
        </div>
        <button id="btn-fav" class="icon-btn star hidden" title="Favorite this aesthetic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.7 5.8 6.3.7-4.7 4.3 1.3 6.2-5.6-3.2L6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></svg>
        </button>
      </div>
      <div id="variant-row"></div>
      <div class="master-row">
        <label title="Overall strength of damage, warping, glow and color treatment">Intensity <span id="intensity-val">1.00</span></label>
        <input id="intensity" class="range-fill" type="range" min="0" max="2" step="0.05" value="1"/>
        <label title="Grain, tape noise, snow, dust and speckle only. 0 renders the look perfectly clean.">Texture <span id="texture-val">1.00</span></label>
        <input id="texture" class="range-fill" type="range" min="0" max="2" step="0.05" value="1"/>
        <div class="seed-row">
          <label>Seed</label>
          <input id="seed" type="number" min="1" max="999999" value="1"/>
          <button id="btn-dice" class="icon-btn" title="New random seed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.6" cy="8.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="8.6" cy="15.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.15" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
      </div>
      <div id="override-row" class="hidden">
        <span id="override-count"></span>
        <button id="btn-reset-overrides" class="link-btn" title="Discard every manual tweak and return to the preset's own values">Reset all</button>
      </div>
      <div id="param-list"><div class="hint">Pick an aesthetic on the left.</div></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
