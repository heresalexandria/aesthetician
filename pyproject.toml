[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aesthetician"
version = "0.13.0"
description = "Premium archival-media aesthetic engine: apply era-authentic film, tape, broadcast, and digital looks (and sounds) to video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "click>=8.1",
    "rich>=13.7",
    "requests>=2.31",
]

[project.scripts]
aesthetician = "aesthetician.cli:main"

[tool.setuptools.packages.find]
include = ["aesthetician*"]

[tool.ruff]
line-length = 110
